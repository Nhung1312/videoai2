name: Server render prototype
on:
  push:
    branches: [codex/server-mp4-prototype]
    paths: ['render-worker/**', 'src/lib/htmlLessonBridge.ts', '.github/workflows/render-worker.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # All CI HTML/audio are committed diagnostic fixtures. This switch must
      # never be carried over to the production worker.
      RENDER_TRUSTED_DIAGNOSTIC: '1'
    defaults:
      run:
        working-directory: render-worker
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: render-worker/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: sudo apt-get update && sudo apt-get install -y xvfb pulseaudio pulseaudio-utils ffmpeg google-chrome-stable
      - run: echo "CHROMIUM_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: npm test
      - run: npm run test:browser
      - run: npm run test:media
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-render-diagnostics
          path: render-worker/artifacts/native-smoke/
          retention-days: 7
