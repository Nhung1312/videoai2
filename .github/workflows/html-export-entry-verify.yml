name: HTML export entry verification
on:
  push:
    branches: [codex/html-export-entry-20261019]
permissions:
  contents: read
jobs:
  entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --legacy-peer-deps --no-audit --no-fund --package-lock=false
      - run: npm run build
      - run: npm run lint
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: render-worker
      - run: npm test
        working-directory: render-worker
      - name: Existing exporter entry and manual HTML regression
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: node tests/html-export-entry.mjs
      - run: node --test tests/html-export-safety.test.mjs
      - run: sudo apt-get update && sudo apt-get install -y xvfb ffmpeg
      - name: Native recording timelines and background abort
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: xvfb-run -a node tests/html-export-recording.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-recording-diagnostics
          path: render-worker/artifacts/html-recording/
          retention-days: 1
          if-no-files-found: ignore
